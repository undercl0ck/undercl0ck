<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>undercl0ck</title>
    <meta name="description" content="undercl0ck.com" />
    <meta name="theme-color" content="#07080a" />
    <link rel="canonical" href="https://undercl0ck.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="undercl0ck" />
    <meta property="og:description" content="undercl0ck.com" />
    <meta property="og:url" content="https://undercl0ck.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <header class="frame">
      <div>undercl0ck.com</div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span> online</div>
    </header>
    <main id="content">
      <section class="panel">
        <p class="kicker">apex domain</p>
        <h1 class="wordmark" aria-label="undercl0ck">
          <span>undercl</span>
          <span class="zero" aria-hidden="true">
            <svg viewBox="0 0 100 100" role="img">
              <circle cx="50" cy="50" r="46" fill="none" stroke="#3dffb0" stroke-width="3.5" />
              <circle cx="50" cy="50" r="3.2" fill="#3dffb0" />
              <line class="hand" data-hour x1="50" y1="50" x2="50" y2="24" stroke="#e8eee9" stroke-width="4" stroke-linecap="round" />
              <line class="hand" data-minute x1="50" y1="50" x2="50" y2="16" stroke="#3dffb0" stroke-width="2.6" stroke-linecap="round" />
              <line class="hand" data-second x1="50" y1="54" x2="50" y2="12" stroke="#7cffd4" stroke-width="1.4" stroke-linecap="round" />
            </svg>
          </span>
          <span>ck</span>
        </h1>
        <p class="lede">A GitHub Pages site bound to this domain. More will land here; the clock already does.</p>
        <dl class="clock-row">
          <div>
            <dt>Local</dt>
            <dd data-local>--</dd>
          </div>
          <div>
            <dt>UTC</dt>
            <dd data-utc>--</dd>
          </div>
        </dl>
      </section>
    </main>
    <footer>
      <div>GitHub Pages</div>
      <a href="https://github.com/ryanheinrich/undercl0ck">source</a>
    </footer>
    <script src="/app.js" defer></script>
  </body>
</html>
